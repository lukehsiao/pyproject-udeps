# Python modules provided by PyPI packages whose module names the naming
# convention cannot derive. The convention swaps dashes for underscores and
# lowercases, so `typing-extensions` needs no entry but `pillow` does.
#
# Keys are PEP 503 normalized package names: lowercase, with runs of `-`,
# `_`, and `.` collapsed to a single `-`. Values are module paths as they
# appear in an import statement, sorted. Importing a listed module, or any
# module below it, counts as using the package.
#
# build.rs rejects unsorted keys and malformed names. The audit in
# contrib/name-map-audit rewrites this file. It keeps this header and
# rejects comments anywhere else, so give the reason for an unusual entry
# in its commit message.
